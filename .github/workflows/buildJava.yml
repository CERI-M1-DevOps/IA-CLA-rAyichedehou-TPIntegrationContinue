name : Java CI with Maven -Test and package
on: 
    pull_request:
      branches: main
jobs:
  build:
    name: Maven CI
    runs-on: ubuntu-latest
    steps:
    - name : Récuperer le code source
      uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version : '21'
        distribution : 'corretto'
    - name: Build with Maven
      run: mvn -B package
    