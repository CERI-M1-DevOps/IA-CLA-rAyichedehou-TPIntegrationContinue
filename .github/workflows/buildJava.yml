name : Java CI with Maven -Test and package
on: 
    pull_request:
      branches: main
jobs:
  build:
    name: Maven CI
    runs-on: ubuntu-latest
    steps:
    - name : Récuperer le code source
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version : '21'
        distribution : 'corretto'
    - name : Cache Maven packages
      uses: actions/cache@v4
      with:
        path : ~/.m2
        key : ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys : ${{ runner.os }}-m2
    - name : Cache Sonar
      uses : actions/cache@v4
      with:
        path : ~/.sonar/cache
        key : ${{ runner.os }}-sonar
        restore-keys : ${{ runner.os }}-sonar
    - name : Verifier la qualité de code
      env :
        SONAR_TOKEN : ${{secrets.SONAR_TOKEN}}
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=$(echo ${{ github.repository }} | sed 's-/-_-')

        
    